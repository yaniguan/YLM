name: lean

on:
  push:
    branches: [main]
    paths: ["lean/**", "src/lab_world.py", "src/lab_token_factory.py", "tests/test_lab_token_factory.py", ".github/workflows/lean.yml"]
  pull_request:
    paths: ["lean/**", "src/lab_world.py", "src/lab_token_factory.py", "tests/test_lab_token_factory.py", ".github/workflows/lean.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build LabLean
        working-directory: lean
        run: lake build
      - name: Run checker on examples
        working-directory: lean
        run: lake exe lablean
      - name: Verify Python lab_world matches LabLean
        env:
          LABLEAN_DIR: lean
        run: python -m pytest -q tests/test_lab_token_factory.py -k lean -o testpaths=tests
