name: labledger
on:
  push:
    branches: [main]
    paths: ["labledger/**", "recipes/coscientist_posttrain/schema.py", ".github/workflows/labledger.yml"]
  pull_request:
    paths: ["labledger/**", "recipes/coscientist_posttrain/schema.py", ".github/workflows/labledger.yml"]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  labledger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install pytest jsonschema ruff
      - run: ruff check labledger --line-length 100
      - run: python -m labledger verify labledger/examples/demo_campaign
      - run: python -m pytest -q labledger/tests -p no:cacheprovider -o testpaths=labledger/tests
