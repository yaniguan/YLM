name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish site/ to gh-pages branch
        run: |
          tmpdir=$(mktemp -d)
          cp -r site/. "$tmpdir/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages-deploy
          git rm -rf .
          cp -r "$tmpdir/." .
          git add -A
          git commit -m "chore(pages): deploy site from ${GITHUB_SHA::7}"
          git push origin HEAD:refs/heads/gh-pages --force
