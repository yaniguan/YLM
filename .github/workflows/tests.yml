name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  pytest-cpu:
    name: pytest-cpu (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: torch 2.10 + e3nn 0.4.4
            torch_spec: "torch==2.10.0"
            e3nn_spec: "e3nn==0.4.4"
          - label: recent torch + e3nn 0.6.0
            torch_spec: "torch>=2.14"
            e3nn_spec: "e3nn==0.6.0"
    env:
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/workflows/tests.yml
      - name: Install (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install "${{ matrix.torch_spec }}" --index-url https://download.pytorch.org/whl/cpu
          pip install "${{ matrix.e3nn_spec }}" numpy scipy rdkit "transformers==5.22.0" pandas pytest jsonschema fastapi httpx
          pip install --no-deps -e .
      - name: Print versions
        run: python -c "import torch, e3nn; print('torch:', torch.__version__, 'e3nn:', e3nn.__version__)"
      - name: pytest (CPU; GPU-only tests skip themselves)
        run: python -m pytest -q
