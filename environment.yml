# Conda environment for YLM v0.
#   conda env create -f environment.yml
#   conda activate ylm
#
# Tested on macOS (Apple M3, MPS) and Rocky Linux 8 (V100).
# On old Linux (glibc 2.17, e.g. CentOS 7) conda-forge pytorch will not install. There, do instead:
#   conda create -n ylm python=3.11 -y && conda activate ylm
#   pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cu124
#   pip install --only-binary=:all: "numpy<2.3" "scipy<1.15" e3nn transformers pytest
# (only training needs to run there; labels and text features are made on another machine)
name: ylm
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pytorch>=2.5
  - numpy
  - scipy
  - rdkit          # read QM9 structures, describe atoms in words
  - tblite-python  # GFN2-xTB labels (dipole, forces)
  - ase
  - pip
  - pip:
      - e3nn==0.6.0
      - transformers>=4.40   # frozen text encoders; Qwen baseline
      - accelerate
      - pytest
