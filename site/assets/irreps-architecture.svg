<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" font-family='Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif'>
  <defs>
    <marker id="a-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#0d9488"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="1200" height="540" rx="14" fill="#ffffff"/>
  <rect x="1" y="1" width="1198" height="538" rx="13" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="36" y="42" font-size="12" font-weight="700" letter-spacing="1.6" fill="#0d9488">ARCHITECTURE · TWO-STREAM SYMMETRY-PRESERVING ALIGNMENT</text>
  <text x="36" y="68" font-size="22" font-weight="650" fill="#0f172a">Invariant Attention Weights α_ti × Wigner-D Equivariant Tensor Values</text>

  <!-- Top Stream: Language -->
  <rect x="40" y="102" width="280" height="145" rx="11" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.4"/>
  <text x="60" y="130" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#1d4ed8">TEXT STREAM (O(3) INVARIANT)</text>
  <text x="60" y="156" font-size="15" font-weight="650" fill="#0f172a">“Force on the carbonyl O?”</text>
  <text x="60" y="180" font-size="12.5" fill="#475569">Frozen MatSciBERT / MiniLM tokens</text>
  <rect x="60" y="196" width="240" height="34" rx="6" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="180" y="218" text-anchor="middle" font-family='"SFMono-Regular", Consolas, ui-monospace, monospace' font-size="12" fill="#1e40af">h_t ∈ ℝ^(T × d_text)  (0e)</text>

  <!-- Bottom Stream: 3D Geometry -->
  <rect x="40" y="302" width="280" height="196" rx="11" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.4"/>
  <text x="60" y="330" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#0f766e">GEOMETRY STREAM (O(3) IRREPS)</text>
  <text x="60" y="356" font-size="15" font-weight="650" fill="#0f172a">3D Atoms (Z_i, r_i ∈ ℝ³)</text>
  <text x="60" y="378" font-size="12.5" fill="#475569">e3nn / MACE / NequIP message passing</text>
  <rect x="60" y="394" width="240" height="86" rx="6" fill="#ffffff" stroke="#99f6e4"/>
  <text x="76" y="416" font-family='"SFMono-Regular", Consolas, ui-monospace, monospace' font-size="11.5" fill="#334155">64×0e  even scalars</text>
  <text x="76" y="435" font-family='"SFMono-Regular", Consolas, ui-monospace, monospace' font-size="11.5" fill="#7c3aed"> 8×0o  chiral pseudoscalars</text>
  <text x="76" y="454" font-family='"SFMono-Regular", Consolas, ui-monospace, monospace' font-size="11.5" fill="#0d9488">32×1o  polar 3D vectors</text>
  <text x="76" y="473" font-family='"SFMono-Regular", Consolas, ui-monospace, monospace' font-size="11.5" fill="#2563eb">16×2e  traceless 3×3 tensors</text>

  <!-- Center Cross-Attention Block -->
  <rect x="386" y="102" width="414" height="396" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="410" y="130" font-size="11.5" font-weight="700" letter-spacing="1.3" fill="#334155">IRREPS-TO-TEXT CROSS-ATTENTION</text>

  <!-- Score computation -->
  <rect x="410" y="150" width="366" height="122" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="428" y="176" font-size="14.5" font-weight="650" fill="#0f172a">Step 1 · Rotation-Invariant Routing α_ti</text>
  <text x="428" y="199" font-family='"SFMono-Regular", Consolas, ui-monospace, monospace' font-size="12" fill="#1d4ed8">k_i^(0e) = [ x_i^(0e), ||x_i^(0o)||, ||x_i^(1o)||, ||x_i^(2e)|| ]</text>
  <text x="428" y="222" font-family='"SFMono-Regular", Consolas, ui-monospace, monospace' font-size="12" fill="#0f172a">s_ti = (q_t · k_i^(0e)) / √d  +  b_dir(Option B)</text>
  <rect x="428" y="234" width="330" height="26" rx="5" fill="#ecfdf5"/>
  <text x="593" y="251" text-anchor="middle" font-family='"SFMono-Regular", Consolas, ui-monospace, monospace' font-size="11.5" font-weight="600" fill="#047857">α_ti(X Qᵀ) = α_ti(X)   ∀ Q ∈ O(3)</text>

  <!-- Value transport -->
  <rect x="410" y="294" width="366" height="182" rx="9" fill="#ffffff" stroke="#5eead4" stroke-width="1.4"/>
  <text x="428" y="320" font-size="14.5" font-weight="650" fill="#0f172a">Step 2 · Equivariant Value Transport &amp; CG</text>
  <text x="428" y="344" font-family='"SFMono-Regular", Consolas, ui-monospace, monospace' font-size="12" fill="#0f766e">v_i = o3.Linear(x_i)    →   m_t = Σ_i α_ti v_i</text>
  <text x="428" y="368" font-size="12.5" fill="#475569">• Option A: gated equivariant readout of pooled m</text>
  <text x="428" y="390" font-size="12.5" fill="#475569">• Option B: + normalized 1o·1o directional inner product</text>
  <text x="428" y="412" font-size="12.5" fill="#475569">• Option C: + channelwise CG  m_t ⊗_CG m_t (0.85M params)</text>
  <rect x="428" y="430" width="330" height="32" rx="5" fill="#eff6ff"/>
  <text x="593" y="451" text-anchor="middle" font-family='"SFMono-Regular", Consolas, ui-monospace, monospace' font-size="12" font-weight="600" fill="#1d4ed8">m_t(X Qᵀ) = D(Q) m_t(X)  (exact)</text>

  <!-- Right Output Heads -->
  <rect x="862" y="102" width="302" height="396" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="882" y="130" font-size="11.5" font-weight="700" letter-spacing="1.3" fill="#475569">EXACT SYMMETRY OUTPUT HEADS</text>

  <rect x="882" y="148" width="262" height="74" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="898" y="171" font-size="13.5" font-weight="700" fill="#0f172a">Scalar Head (0e)</text>
  <text x="898" y="191" font-size="12" fill="#475569">Energy, HOMO-LUMO gap, text logits</text>
  <text x="898" y="210" font-family='"SFMono-Regular", Consolas, ui-monospace, monospace' font-size="11.5" fill="#334155">f(X Qᵀ) = f(X)</text>

  <rect x="882" y="234" width="262" height="78" rx="8" fill="#faf5ff" stroke="#d8b4fe"/>
  <text x="898" y="257" font-size="13.5" font-weight="700" fill="#6d28d9">Chiral Pseudoscalar (0o)</text>
  <text x="898" y="277" font-size="12" fill="#475569">(R)/(S) handedness · planar = 0</text>
  <text x="898" y="298" font-family='"SFMono-Regular", Consolas, ui-monospace, monospace' font-size="11.5" fill="#6d28d9">f(X Qᵀ) = det(Q) · f(X)</text>

  <rect x="882" y="324" width="262" height="78" rx="8" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="898" y="347" font-size="13.5" font-weight="700" fill="#0f766e">Polar 3D Vector (1o / &lt;vec&gt;)</text>
  <text x="898" y="367" font-size="12" fill="#475569">Atom force F_i, dipole μ</text>
  <text x="898" y="388" font-family='"SFMono-Regular", Consolas, ui-monospace, monospace' font-size="11.5" fill="#0f766e">f(X Qᵀ) = f(X) Qᵀ</text>

  <rect x="882" y="414" width="262" height="70" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="898" y="437" font-size="13.5" font-weight="700" fill="#1d4ed8">Symmetric 3×3 Tensor (0e ⊕ 2e)</text>
  <text x="898" y="457" font-size="12" fill="#475569">Quadrupole Θ, polarizability α</text>
  <text x="898" y="474" font-family='"SFMono-Regular", Consolas, ui-monospace, monospace' font-size="11.5" fill="#1d4ed8">M(X Qᵀ) = Q M(X) Qᵀ</text>

  <!-- Connectors -->
  <line x1="320" y1="185" x2="404" y2="185" stroke="#2563eb" stroke-width="2.2" marker-end="url(#a-blue)"/>
  <line x1="320" y1="365" x2="404" y2="235" stroke="#0d9488" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#a-teal)"/>
  <line x1="320" y1="415" x2="404" y2="355" stroke="#0d9488" stroke-width="2.2" marker-end="url(#a-teal)"/>
  <line x1="776" y1="365" x2="856" y2="365" stroke="#0d9488" stroke-width="2.4" marker-end="url(#a-teal)"/>
</svg>
