[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ylm"
version = "0.1.0"
description = "Irreps-to-text cross-attention for O(3)-equivariant language-geometry alignment"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "e3nn>=0.4.4",
    "numpy>=1.24",
    "scipy>=1.10",
    "transformers>=4.40",
]

[project.optional-dependencies]
data = [
    "rdkit",
    "pandas",
    "scikit-learn",
]
crystals = [
    "pymatgen",
    "mp-api",
]
mace = [
    "mace-torch>=0.3.6",
]
md = [
    "matplotlib>=3.7",
]
test = [
    "pytest>=7.0",
]

[project.scripts]
ylm = "src.toolkit.cli:main"

[tool.setuptools]
packages = ["src", "src.tasks", "src.toolkit"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
